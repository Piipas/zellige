name: Bug report
description: Something looks wrong or doesn't work.
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: URL
      description: The image or page URL you used.
      placeholder: https://…/api/zellige?user=octocat&theme=night
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, what you saw instead, and a screenshot if it's visual.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did you see it?
      options:
        - In a GitHub README
        - On the website
        - Opening the SVG directly
        - Self-hosted deployment
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 140 on macOS
